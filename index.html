<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:0 16px}.top{height:70px;border-bottom:1px solid #1d344b;display:flex;align-items:center;justify-content:space-between}.logo{font-size:26px;font-weight:900}.logo i{color:#61d8ff;font-style:normal}.nav button{background:transparent;color:#9db0c5;border:0;padding:9px 11px;border-radius:9px}.nav button.on,.nav button:hover{background:#10253a;color:white}
.hero{padding:65px 0 35px}.ey{font-size:12px;border:1px solid #29475f;border-radius:99px;padding:5px 10px;display:inline-block}.hero h1{font-size:clamp(48px,8vw,78px);line-height:.95;margin:18px 0}.blue{color:#61d8ff}.hero p{max-width:680px;color:#95a9bd;line-height:1.6}.primary{background:#61d8ff;color:#03131d;border:0;padding:13px 18px;border-radius:11px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.test,.panel,.notice{background:#0c1a2b;border:1px solid #203a52;border-radius:16px;padding:18px}.card p,.test p,.sub{color:#95a9bd;line-height:1.5}.page{padding:34px 0}.test{margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px}.tag{font-size:11px;border:1px solid #2b4b65;border-radius:99px;padding:4px 8px}.lock{font-size:11px;color:#92a5ba}.syll{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.syll div{background:#081624;padding:12px;border-radius:10px}.syll small{display:block;color:#a7b8ca;margin-top:5px;line-height:1.35}.panel{max-width:620px}.field{display:grid;gap:6px;margin:13px 0;color:#a9bacd}.field input,.field select{background:#081624;color:#fff;border:1px solid #29465e;border-radius:9px;padding:11px}.notice{margin:15px 0;color:#aebed0}.cbt{max-width:780px;margin:25px auto}.opt{width:100%;display:block;text-align:left;background:#0a1929;color:#eef6ff;border:1px solid #29465e;border-radius:9px;padding:13px;margin:8px 0}.opt.sel{border-color:#61d8ff;background:#102c40}.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.timer{font-size:21px;font-weight:900}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.actions button{background:#12283c;color:#fff;border:1px solid #29465e;border-radius:9px;padding:10px 13px}.actions .submit{background:#61d8ff;color:#03131d;border:0;font-weight:800}.result{text-align:center;padding:75px 0}.result h1{font-size:60px}@media(max-width:700px){.top{height:auto;padding:12px 0;align-items:flex-start;gap:8px}.nav{display:flex;flex-wrap:wrap;justify-content:flex-end}.syll{grid-template-columns:1fr}.row{flex-direction:column}}
</style></head><body><div class="wrap">
<header class="top"><div class="logo">RANK<span>LY</span></div><div class="nav" id="nav"></div></header><main id="app"></main><footer class="sub" style="text-align:center;padding:40px 0">RANKLY • NEET 2027 • Affordable testing for students</footer>
</div>
<script>
const tests=[
["01","20 Sep 2026","RFT-01","Rankly Focus Test","Units & Measurements / Motion in a Straight Line","Some Basic Concepts of Chemistry","Cell: The Unit of Life","Cell Cycle & Cell Division"],
["02","27 Sep 2026","RBT-01","Rankly Booster Test","Motion in a Plane / Laws of Motion","Structure of Atom","Biomolecules","Animal Tissues"],
["03","04 Oct 2026","RFT-02","Rankly Focus Test","Laws of Motion / Work, Energy & Power","Classification of Elements & Periodicity","The Living World","Structural Organisation in Animals"],
["04","11 Oct 2026","RBT-02","Rankly Booster Test","Cumulative revision","Cumulative revision","Cumulative revision","Cumulative revision"],
["05","18 Oct 2026","RFT-03","Rankly Focus Test","System of Particles & Rotational Motion","Chemical Bonding","Biological Classification","Breathing & Exchange of Gases"],
["06","25 Oct 2026","RBT-03","Rankly Booster Test","Work, Energy & Power / Gravitation","Thermodynamics","Principles of Inheritance","Body Fluids & Circulation"],
["07","01 Nov 2026","RFT-04","Rankly Focus Test","Gravitation / Mechanical Properties","Equilibrium","Molecular Basis of Inheritance","Excretory Products & Elimination"],
["08","08 Nov 2026","RBT-04","Rankly Booster Test","Cumulative revision","Cumulative revision","Cumulative revision","Cumulative revision"],
["09","15 Nov 2026","RFT-05","Rankly Focus Test","Thermal Properties / Thermodynamics","Redox Reactions","Anatomy of Flowering Plants","Locomotion & Movement"],
["10","22 Nov 2026","RBT-05","Rankly Booster Test","Kinetic Theory / Oscillations","Solutions","Morphology of Flowering Plants","Neural Control & Coordination"],
["11","29 Nov 2026","RFT-06","Rankly Focus Test","Waves","Electrochemistry","Plant Growth & Development","Chemical Coordination & Integration"],
["12","06 Dec 2026","RBT-06","Rankly Booster Test","Cumulative revision","Cumulative revision","Cumulative revision","Cumulative revision"],
["13","13 Dec 2026","RFT-07","Rankly Focus Test","Electric Charges & Fields","Chemical Kinetics","Photosynthesis in Plants","Animal Kingdom"],
["14","20 Dec 2026","RBT-07","Rankly Booster Test","Electrostatic Potential & Capacitance","Haloalkanes & Haloarenes","Respiration in Plants","Human Reproduction"],
["15","27 Dec 2026","RFT-08","Rankly Focus Test","Current Electricity","Alcohols, Phenols & Ethers","Microbes in Human Welfare","Reproductive Health"],
["16","03 Jan 2027","RBT-08","Rankly Booster Test","Cumulative revision","Cumulative revision","Cumulative revision","Cumulative revision"],
["17","10 Jan 2027","RFT-09","Rankly Focus Test","Moving Charges & Magnetism","Aldehydes, Ketones & Carboxylic Acids","Organisms & Populations","Evolution"],
["18","17 Jan 2027","RBT-09","Rankly Booster Test","Magnetism & Matter","Amines","Ecosystem","Human Health & Disease"],
["19","24 Jan 2027","RFT-10","Rankly Focus Test","Electromagnetic Induction","Biomolecules","Biodiversity & Conservation","Biotechnology: Principles"],
["20","31 Jan 2027","RBT-10","Rankly Booster Test","Alternating Current","Coordination Compounds","Sexual Reproduction in Flowering Plants","Biotechnology: Applications"],
["21","07 Feb 2027","RFT-11","Rankly Focus Test","Electromagnetic Waves / Ray Optics","d- and f-Block Elements","Inheritance revision","Human Health revision"],
["22","14 Feb 2027","RBT-11","Rankly Booster Test","Wave Optics","Inorganic revision","Molecular Basis revision","Human Reproduction revision"],
["23","21 Feb 2027","RFT-12","Rankly Focus Test","Dual Nature / Atoms","Organic revision","Photosynthesis revision","Reproductive Health revision"],
["24","28 Feb 2027","RBT-12","Rankly Booster Test","Nuclei / Semiconductor Electronics","Physical Chemistry revision","Respiration revision","Evolution revision"],
["25","07 Mar 2027","RFT-13","Rankly Focus Test","Modern Physics revision","Inorganic revision","Plant Growth revision","Biotechnology revision"],
["26","14 Mar 2027","RBT-13","Rankly Booster Test","Optics revision","Organic revision","Ecology revision","Animal Biology revision"],
["27","21 Mar 2027","RFT-14","Rankly Focus Test","Full Physics revision loop","Full Chemistry revision loop","Full Botany revision loop","Full Zoology revision loop"],
["28","28 Mar 2027","RBT-14","Rankly Booster Test","Full Physics revision loop","Full Chemistry revision loop","Full Botany revision loop","Full Zoology revision loop"],
["29","04 Apr 2027","PRE-NEET-01","Rankly Pre-NEET Major 01","Complete Class 11","Complete Class 11","Complete Class 11","Complete Class 11"],
["30","11 Apr 2027","PRE-NEET-02","Rankly Pre-NEET Major 02","Complete Class 12","Complete Class 12","Complete Class 12","Complete Class 12"],
["31","18 Apr 2027","UGM-01","Rankly Ultimate Grand Mock 01","Full Syllabus","Full Syllabus","Full Syllabus","Full Syllabus"],
["32","25 Apr 2027","UGM-02","Rankly Ultimate Grand Mock 02","Full Syllabus","Full Syllabus","Full Syllabus","Full Syllabus"],
["33","02 May 2027","FSS","Rankly Final Selection Simulator","Full Syllabus","Full Syllabus","Full Syllabus","Full Syllabus"]];

const demo = [
  {
    id:"P1",
    subject:"Physics",
    q:"A particle moves with constant velocity. What is its acceleration?",
    options:["0","1 m/s²","9.8 m/s²","Cannot be determined"],
    answer:0
  },
  {
    id:"P2",
    subject:"Physics",
    q:"The SI unit of force is:",
    options:["Joule","Newton","Watt","Pascal"],
    answer:1
  },
  {
    id:"C1",
    subject:"Chemistry",
    q:"The atomic number of oxygen is:",
    options:["6","7","8","16"],
    answer:2
  },
  {
    id:"C2",
    subject:"Chemistry",
    q:"Which particle has a negative charge?",
    options:["Proton","Neutron","Electron","Alpha particle"],
    answer:2
  },
  {
    id:"B1",
    subject:"Biology",
    q:"The basic structural and functional unit of life is:",
    options:["Tissue","Cell","Organ","Organ system"],
    answer:1
  },
  {
    id:"B2",
    subject:"Biology",
    q:"Which organelle is known as the powerhouse of the cell?",
    options:["Nucleus","Ribosome","Mitochondria","Golgi apparatus"],
    answer:2
  }
];

let page="home";
let currentTest=null;
let questions=[];
let answers={};
let marked={};
let current=0;
let time=0;
let interval=null;
let testStarted=false;

function nav(p){
  clearInterval(interval);
  page=p;
  testStarted=false;
  render();
  window.scrollTo(0,0);
}

function startTest(index){

  currentTest=tests[index];

  /*
    For now the CBT engine uses the demo question bank.
    Later we can connect 180 verified questions to every test.
  */
  questions=[...demo];

  answers={};
  marked={};
  current=0;

  /*
    NEET CBT timer.
    Demo uses 30 minutes.
    Change to 200 minutes when the complete 180-question
    paper is connected.
  */
  time=30*60;

  testStarted=true;
  page="cbt";

  clearInterval(interval);
  interval=setInterval(()=>{
    time--;

    if(time<=0){
      clearInterval(interval);
      finish();
      return;
    }

    const timer=document.getElementById("timer");
    if(timer) timer.textContent=formatTime(time);
  },1000);

  render();
  window.scrollTo(0,0);
}

function formatTime(sec){
  const m=Math.floor(sec/60);
  const s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function selectAnswer(i){
  answers[questions[current].id]=i;
  renderCBT();
}

function toggleMark(){
  const id=questions[current].id;
  marked[id]=!marked[id];
  renderCBT();
}

function previousQuestion(){
  if(current>0){
    current--;
    renderCBT();
  }
}

function nextQuestion(){
  if(current<questions.length-1){
    current++;
    renderCBT();
  }
}

function jumpQuestion(i){
  current=i;
  renderCBT();
}

function finish(){

  clearInterval(interval);

  let score=0;
  let correct=0;
  let wrong=0;
  let unattempted=0;

  questions.forEach(q=>{
    const selected=answers[q.id];

    if(selected===undefined){
      unattempted++;
    }else if(selected===q.answer){
      correct++;
      score+=4;
    }else{
      wrong++;
      score-=1;
    }
  });

  page="result";

  window.__result={
    score,
    correct,
    wrong,
    unattempted,
    total:questions.length
  };

  render();
  window.scrollTo(0,0);
}

function renderCBT(){

  const q=questions[current];

  const answeredCount=Object.keys(answers).length;
  const markedCount=Object.values(marked).filter(Boolean).length;

  document.getElementById("app").innerHTML=`

    <section class="page">

      <div class="testbar">

        <div>
          <strong>${currentTest ? currentTest[2] : "RANKLY TEST"}</strong>
          <div class="sub">${currentTest ? currentTest[0] : "NEET 2027"}</div>
        </div>

        <div class="timerbox">
          ⏱ <span id="timer">${formatTime(time)}</span>
        </div>

      </div>

      <div class="cbtstats">
        <span>Answered: ${answeredCount}/${questions.length}</span>
        <span>Marked: ${markedCount}</span>
      </div>

      <div class="cbtgrid">

        <main class="questionbox">

          <div class="qtop">
            <span>Question ${current+1} of ${questions.length}</span>
            <span>${q.subject}</span>
          </div>

          <h2>${q.q}</h2>

          <div class="options">

            ${q.options.map((op,i)=>`

              <button
                class="option ${answers[q.id]===i ? "selected":""}"
                onclick="selectAnswer(${i})"
              >
                <span>${String.fromCharCode(65+i)}</span>
                ${op}
              </button>

            `).join("")}

          </div>

          <div class="actions">

            <button onclick="previousQuestion()">
              ← Previous
            </button>

            <button onclick="toggleMark()">
              ${marked[q.id] ? "★ Unmark" : "☆ Mark for Review"}
            </button>

            ${
              current<questions.length-1
              ? `<button class="primary" onclick="nextQuestion()">Save & Next →</button>`
              : `<button class="submit" onclick="finish()">Submit Test</button>`
            }

          </div>

        </main>

        <aside class="palette">

          <h3>Question Palette</h3>

          <div class="legend">
            <span>🟢 Answered</span>
            <span>⚪ Not Answered</span>
            <span>🟡 Review</span>
          </div>

          <div class="qnumbers">

            ${questions.map((x,i)=>`

              <button
                class="
                  qnum
                  ${answers[x.id]!==undefined ? "answered":""}
                  ${marked[x.id] ? "review":""}
                  ${current===i ? "active":""}
                "
                onclick="jumpQuestion(${i})"
              >
                ${i+1}
              </button>

            `).join("")}

          </div>

          <button class="finishbtn" onclick="finish()">
            Submit Test
          </button>

        </aside>

      </div>

    </section>
  `;

  const timer=document.getElementById("timer");

  if(timer){
    timer.textContent=formatTime(time);
  }
}

function renderResult(){

  const r=window.__result || {
    score:0,
    correct:0,
    wrong:0,
    unattempted:0,
    total:0
  };

  const maxMarks=r.total*4;

  document.getElementById("app").innerHTML=`

    <section class="page">

      <div class="resulthero">

        <span class="badge">TEST COMPLETED</span>

        <h1>Your Result</h1>

        <div class="score">${r.score}</div>

        <p>Score out of ${maxMarks}</p>

      </div>

      <div class="resultgrid">

        <div class="resultcard">
          <b>${r.correct}</b>
          <span>Correct</span>
        </div>

        <div class="resultcard">
          <b>${r.wrong}</b>
          <span>Wrong</span>
        </div>

        <div class="resultcard">
          <b>${r.unattempted}</b>
          <span>Unattempted</span>
        </div>

        <div class="resultcard">
          <b>${r.total ? Math.round((r.correct/r.total)*100) : 0}%</b>
          <span>Accuracy</span>
        </div>

      </div>

      <div class="panel">

        <h2>Scoring Breakdown</h2>

        <p>Correct: +4 × ${r.correct}</p>
        <p>Wrong: −1 × ${r.wrong}</p>
        <p>Unattempted: 0 × ${r.unattempted}</p>

        <hr>

        <h2>Total Score: ${r.score}</h2>

      </div>

      <div class="actions">

        <button onclick="nav('home')">
          ← Back to RANKLY
        </button>

        <button class="primary" onclick="nav('schedule')">
          View Test Schedule
        </button>

      </div>

    </section>
  `;
}

function renderHome(){

  document.getElementById("app").innerHTML=`

    <section class="hero">

      <span class="badge">NEET 2027 • AIR TEST SERIES</span>

      <h1>
        Test smarter.<br>
        <span>Rank higher.</span>
      </h1>

      <p>
        RANKLY is built around scheduled CBT tests,
        custom practice, verified PYQs and meaningful
        performance analysis.
      </p>

      <button class="primary big" onclick="nav('schedule')">
        View 33-Test Schedule →
      </button>

    </section>

    <section class="grid">

      <div class="card">
        <h2>🏆 AIR Test Series</h2>
        <p>
          33 scheduled tests from 20 Sep 2026
          to 02 May 2027.
        </p>
        <button onclick="nav('schedule')">
          View Tests →
        </button>
      </div>

      <div class="card">
        <h2>🎯 Custom CBT</h2>
        <p>
          Choose subject, chapter, topic and
          question count.
        </p>
        <button onclick="nav('custom')">
          Create Test →
        </button>
      </div>

      <div class="card">
        <h2>📚 PYQ Bank</h2>
        <p>
          Practice NEET previous-year questions.
        </p>
        <button onclick="nav('pyq')">
          Open PYQs →
        </button>
      </div>

    </section>
  `;
}

function renderSchedule(){

  document.getElementById("app").innerHTML=`

    <section class="page">

      <span class="badge">NEET 2027</span>

      <h1>33-Test AIR Schedule</h1>

      <p class="sub">
        Scheduled tests from September 2026
        to May 2027.
      </p>

      <div class="testlist">

        ${tests.map((t,i)=>`

          <div class="testcard">

            <div>
              <span class="testid">${t[0]}</span>

              <h2>${t[2]}</h2>

              <p>${t[1]}</p>

              <small>
                ${t.slice(3).filter(Boolean).join(" • ")}
              </small>
            </div>

            <button
              class="primary"
              onclick="startTest(${i})"
            >
              Start Test →
            </button>

          </div>

        `).join("")}

      </div>

    </section>
  `;
}

function renderCustom(){

  document.getElementById("app").innerHTML=`

    <section class="page">

      <span class="badge">CUSTOM CBT</span>

      <h1>Create Your Test</h1>

      <p class="sub">
        Build a practice test according to your
        subject and difficulty.
      </p>

      <div class="panel">

        <label>Subject</label>

        <select id="customSubject">
          <option>Physics</option>
          <option>Chemistry</option>
          <option>Biology</option>
          <option>Full Syllabus</option>
        </select>

        <label>Questions</label>

        <select id="customCount">
          <option value="10">10 Questions</option>
          <option value="30">30 Questions</option>
          <option value="45">45 Questions</option>
          <option value="90">90 Questions</option>
          <option value="180">180 Questions</option>
        </select>

        <button class="primary" onclick="startCustom()">
          Generate CBT →
        </button>

      </div>

    </section>
  `;
}

function startCustom(){

  const subject=document.getElementById("customSubject").value;
  const count=Number(document.getElementById("customCount").value);

  let bank=demo;

  if(subject!=="Full Syllabus"){
    bank=demo.filter(q=>q.subject===subject);
  }

  /*
    Do not fake questions.
    Only currently available verified questions are used.
  */
  questions=[...bank];

  if(!questions.length){
    alert("No questions available for this selection yet.");
    return;
  }

  currentTest=[
    "CUSTOM",
    "",
    subject+" Custom CBT"
  ];

  answers={};
  marked={};
  current=0;
  time=Math.max(10,questions.length*60);

  testStarted=true;
  page="cbt";

  clearInterval(interval);

  interval=setInterval(()=>{
    time--;

    if(time<=0){
      clearInterval(interval);
      finish();
    }

    const timer=document.getElementById("timer");

    if(timer){
      timer.textContent=formatTime(time);
    }
  },1000);

  render();
}

function renderPYQ(){

  document.getElementById("app").innerHTML=`

    <section class="page">

      <span class="badge">PYQ BANK</span>

      <h1>NEET Previous Year Questions</h1>

      <p class="sub">
        Verified PYQ practice will be added
        chapter-wise.
      </p>

      <div class="panel">

        <h2>Coming next</h2>

        <p>
          Physics • Chemistry • Biology
        </p>

        <p>
          Chapter-wise → Topic-wise → Year-wise
        </p>

      </div>

    </section>
  `;
}

function render(){

  const nav=document.getElementById("nav");

  if(nav){

    nav.innerHTML=`

      <button onclick="nav('home')"
        class="${page==='home'?'active':''}">
        Home
      </button>

      <button onclick="nav('schedule')"
        class="${page==='schedule'?'active':''}">
        AIR Tests
      </button>

      <button onclick="nav('custom')"
        class="${page==='custom'?'active':''}">
        Custom CBT
      </button>

      <button onclick="nav('pyq')"
        class="${page==='pyq'?'active':''}">
        PYQ
      </button>

    `;
  }

  if(page==="home") renderHome();
  else if(page==="schedule") renderSchedule();
  else if(page==="custom") renderCustom();
  else if(page==="pyq") renderPYQ();
  else if(page==="cbt") renderCBT();
  else if(page==="result") renderResult();
}

render();
